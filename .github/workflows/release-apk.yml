name: Publish Android Debug APK Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    name: Build & Publish Debug APK to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate or Build Installable Debug APK
        id: prepare_apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Extract app_name, applicationId, and versionName dynamically from Android project files
          APP_NAME=$(sed -n 's/.*<string name="app_name">\([^<]*\)<\/string>.*/\1/p' app/src/main/res/values/strings.xml | head -n 1 || true)
          if [ -z "$APP_NAME" ]; then
            APP_NAME="AndroidApp"
          fi
          SAFE_APP_NAME=$(echo "$APP_NAME" | tr -cd '[:alnum:]._-' )
          if [ -z "$SAFE_APP_NAME" ]; then
            SAFE_APP_NAME="AndroidApp"
          fi

          APP_ID=$(sed -n 's/.*applicationId *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1 || true)
          if [ -z "$APP_ID" ]; then
            APP_ID="com.example"
          fi

          VERSION_NAME=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1 || true)
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0"
          fi

          mkdir -p dist

          # 1. Ensure debug.keystore exists (AI Studio strips debug.keystore and debug.keystore.base64 when exporting to GitHub)
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Restoring debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Restoring AI Studio debug.keystore..."
              DEBUG_KEYSTORE_B64=""
              echo "$DEBUG_KEYSTORE_B64" | base64 -d > debug.keystore || keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # 2. Ensure app/google-services.json exists (AI Studio strips google-services.json when exporting to GitHub)
          if [ ! -f "app/google-services.json" ]; then
            echo "Restoring app/google-services.json for Google Services plugin & default_web_client_id..."
            GOOGLE_SERVICES_GZ_B64=""
            echo "$GOOGLE_SERVICES_GZ_B64" | base64 -d | gunzip > app/google-services.json

            # Ensure current applicationId from app/build.gradle.kts is present in app/google-services.json
            python3 - "$APP_ID" <<'PYEOF'
          import json, sys, copy
          app_id = sys.argv[1]
          path = "app/google-services.json"
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          clients = data.get("client", [])
          has_pkg = any(
              c.get("client_info", {}).get("android_client_info", {}).get("package_name") == app_id
              for c in clients
          )
          if not has_pkg and clients:
              template = copy.deepcopy(clients[0])
              template.setdefault("client_info", {}).setdefault("android_client_info", {})["package_name"] = app_id
              for oauth in template.get("oauth_client", []):
                  if "android_info" in oauth:
                      oauth["android_info"]["package_name"] = app_id
              clients.append(template)
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2)
          PYEOF
          fi

          # 3. Ensure .env exists if required by Secrets Gradle Plugin
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

          # 4. Use pre-compiled APK if present, otherwise compile with Gradle
          if [ -f ".build-outputs/app-debug.apk" ]; then
            echo "Found pre-compiled Google AI Studio native APK at .build-outputs/app-debug.apk"
            cp -f ".build-outputs/app-debug.apk" "dist/app-debug.apk"
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Found pre-compiled APK at app/build/outputs/apk/debug/app-debug.apk"
            cp -f "app/build/outputs/apk/debug/app-debug.apk" "dist/app-debug.apk"
          else
            echo "Compiling installable debug APK with Gradle..."
            gradle assembleDebug --no-daemon
            cp -f "app/build/outputs/apk/debug/app-debug.apk" "dist/app-debug.apk"
          fi

          cp -f "dist/app-debug.apk" "dist/${SAFE_APP_NAME}-debug.apk"
          APK_SIZE=$(du -h "dist/app-debug.apk" | cut -f1)
          APK_SHA256=$(sha256sum "dist/app-debug.apk" | awk '{print $1}')

          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "safe_app_name=${SAFE_APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "app_id=${APP_ID}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_size=${APK_SIZE}" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=${APK_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_apk.outputs.safe_app_name }}-debug-apk
          path: |
            dist/app-debug.apk
            dist/${{ steps.prepare_apk.outputs.safe_app_name }}-debug.apk
          if-no-files-found: error

      - name: Publish Permanent GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.prepare_apk.outputs.version_name }}"
          TITLE="${{ steps.prepare_apk.outputs.app_name }} ${TAG} (Installable Debug APK)"
          REPO="${{ github.repository }}"

          cat <<EOF > release_notes.md
          ## ${{ steps.prepare_apk.outputs.app_name }} — Installable Android Debug APK

          - **Application Name:** ${{ steps.prepare_apk.outputs.app_name }}
          - **Package / Application ID:** \`${{ steps.prepare_apk.outputs.app_id }}\`
          - **Version:** \`${{ steps.prepare_apk.outputs.version_name }}\`
          - **APK Size:** \`${{ steps.prepare_apk.outputs.apk_size }}\`
          - **SHA-256 Checksum:** \`${{ steps.prepare_apk.outputs.apk_sha256 }}\`

          ### Direct Download Links
          - **Permanent Latest APK URL:** https://github.com/${REPO}/releases/latest/download/app-debug.apk
          - **Named APK URL:** https://github.com/${REPO}/releases/latest/download/${{ steps.prepare_apk.outputs.safe_app_name }}-debug.apk
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/app-debug.apk" \
              "dist/${{ steps.prepare_apk.outputs.safe_app_name }}-debug.apk" \
              --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release_notes.md --latest
          else
            gh release create "$TAG" \
              "dist/app-debug.apk" \
              "dist/${{ steps.prepare_apk.outputs.safe_app_name }}-debug.apk" \
              --title "$TITLE" \
              --notes-file release_notes.md \
              --latest
          fi
