name: Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build & Verify Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode Release Keystore & Configure Signing Environment
        id: decode_keystore
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          # Use repository secrets if configured; otherwise use the configured HAMZAAWAN release identity keystore
          DEFAULT_KEYSTORE_B64=""

          RELEASE_KEYSTORE_BASE64="${SECRET_KEYSTORE_B64:-$DEFAULT_KEYSTORE_B64}"
          STORE_PASSWORD="${SECRET_STORE_PASSWORD:-Pakarmy007@}"
          KEY_PASSWORD="${SECRET_KEY_PASSWORD:-Pakarmy007@}"
          KEY_ALIAS="${SECRET_KEY_ALIAS:-upload}"

          if [ "$KEY_ALIAS" = "androiddebugkey" ]; then
            echo "::error::KEY_ALIAS cannot be 'androiddebugkey'. You must use your own release certificate."
            exit 1
          fi

          KEYSTORE_FILE="${RUNNER_TEMP}/markethub-release-signing.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"

          # Verify the keystore and ensure it is NOT an Android Debug certificate
          CERT_INFO=$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1) || {
            echo "::error::Failed to read alias '$KEY_ALIAS' from the decoded release keystore."
            exit 1
          }

          if echo "$CERT_INFO" | grep -qi "CN=Android Debug"; then
            echo "::error::The provided keystore contains a debug certificate (CN=Android Debug)."
            exit 1
          fi

          if grep -q 'keyAlias *= *"upload"' app/build.gradle.kts && [ "$KEY_ALIAS" != "upload" ]; then
            keytool -changealias \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -destalias "upload"
          fi

          echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=${STORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${KEY_PASSWORD}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "Release keystore decoded and validated in temporary storage."

      - name: Prepare Firebase & Build Configuration
        run: |
          set -euo pipefail

          APP_ID=$(sed -n 's/.*applicationId *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1 || true)
          if [ -z "$APP_ID" ]; then
            APP_ID="com.aistudio.markethub.pkxmvz"
          fi

          VERSION_NAME=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1 || true)
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0"
          fi

          echo "APP_ID=${APP_ID}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

          # Ensure debug.keystore exists so Gradle's signingConfigs block initializes cleanly
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Restore app/google-services.json during the CI build if stripped during GitHub export
          if [ ! -f "app/google-services.json" ]; then
            GOOGLE_SERVICES_GZ_B64=""
            echo "$GOOGLE_SERVICES_GZ_B64" | base64 -d | gunzip > app/google-services.json
          fi

          # Ensure .env exists from .env.example for the Secrets Gradle Plugin
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Build Signed Release APK (assembleRelease)
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p dist

          if [ -f ".build-outputs/MarketHub-release.apk" ]; then
            echo "Found pre-built release-signed APK at .build-outputs/MarketHub-release.apk"
            cp -f ".build-outputs/MarketHub-release.apk" "dist/MarketHub-release.apk"
          else
            echo "Running Gradle assembleRelease..."
            if [ -x "./gradlew" ]; then
              ./gradlew :app:assembleRelease --no-daemon
            else
              gradle :app:assembleRelease --no-daemon
            fi

            RELEASE_APK_PATH="app/build/outputs/apk/release/app-release.apk"
            if [ ! -f "$RELEASE_APK_PATH" ]; then
              echo "::error::Expected signed release APK was not generated at $RELEASE_APK_PATH"
              exit 1
            fi
            cp -f "$RELEASE_APK_PATH" "dist/MarketHub-release.apk"
          fi

      - name: Verify APK Signing Certificate with apksigner
        id: verify_apk
        run: |
          set -euo pipefail

          APK_FILE="dist/MarketHub-release.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "::error::Release APK file '$APK_FILE' does not exist!"
            exit 1
          fi

          APKSIGNER=""
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "${ANDROID_HOME}/build-tools" ]; then
            APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name "apksigner" -type f | sort -V | tail -n 1 || true)
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "${ANDROID_SDK_ROOT}/build-tools" ]; then
            APKSIGNER=$(find "${ANDROID_SDK_ROOT}/build-tools" -name "apksigner" -type f | sort -V | tail -n 1 || true)
          fi

          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(command -v apksigner || true)
          fi

          if [ -z "$APKSIGNER" ]; then
            echo "::error::Could not find 'apksigner' in Android SDK build-tools."
            exit 1
          fi

          echo "Using apksigner: $APKSIGNER"

          # Ensure v1 (JAR), v2, and v3 signature schemes are all enabled for Amazon Appstore compatibility
          "$APKSIGNER" sign \
            --min-sdk-version 18 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --ks "${KEYSTORE_PATH}" \
            --ks-pass "pass:${STORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --ks-key-alias "upload" \
            "$APK_FILE"

          VERIFY_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "$APK_FILE" 2>&1) || {
            echo "$VERIFY_OUTPUT"
            echo "::error::APK signature verification failed! The APK is unsigned or has an invalid signature."
            exit 1
          }

          echo "$VERIFY_OUTPUT"

          # Reject if signed with an Android Debug certificate
          if echo "$VERIFY_OUTPUT" | grep -qiE "CN=Android Debug|O=Android, C=US|androiddebugkey"; then
            echo "::error::REJECTED: The APK is signed with a debug certificate (CN=Android Debug). Amazon Appstore requires your own identity certificate."
            exit 1
          fi

          CERT_DN=$(echo "$VERIFY_OUTPUT" | grep -m 1 "Signer #1 certificate DN:" | sed 's/Signer #1 certificate DN: //' || true)
          CERT_SHA256=$(echo "$VERIFY_OUTPUT" | grep -m 1 "Signer #1 certificate SHA-256 digest:" | awk '{print $NF}' || true)
          APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
          APK_SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')

          echo "cert_dn=${CERT_DN}" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=${CERT_SHA256}" >> "$GITHUB_OUTPUT"
          echo "apk_size=${APK_SIZE}" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=${APK_SHA256}" >> "$GITHUB_OUTPUT"

          echo "SUCCESS: MarketHub-release.apk is validly signed with release certificate: ${CERT_DN}"

      - name: Upload Verified Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketHub-release.apk
          path: dist/MarketHub-release.apk
          if-no-files-found: error

      - name: Publish Verified Release APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ env.VERSION_NAME }}"
          TITLE="MarketHub ${TAG} (Signed Release APK)"
          REPO="${{ github.repository }}"

          cat <<EOF > release_notes.md
          ## MarketHub — Signed Android Release APK

          - **Application Name:** MarketHub
          - **Package / Application ID:** \`${{ env.APP_ID }}\`
          - **Version:** \`${{ env.VERSION_NAME }}\`
          - **Build Type:** \`release\` (\`assembleRelease\`)
          - **Signer Certificate DN:** \`${{ steps.verify_apk.outputs.cert_dn }}\`
          - **Signer Certificate SHA-256:** \`${{ steps.verify_apk.outputs.cert_sha256 }}\`
          - **APK Size:** \`${{ steps.verify_apk.outputs.apk_size }}\`
          - **APK SHA-256 Checksum:** \`${{ steps.verify_apk.outputs.apk_sha256 }}\`

          ### Direct Download Link
          - **Release APK URL:** https://github.com/${REPO}/releases/latest/download/MarketHub-release.apk
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" "app-debug.apk" --yes >/dev/null 2>&1 || true
            gh release delete-asset "$TAG" "MarketHub-debug.apk" --yes >/dev/null 2>&1 || true
            gh release upload "$TAG" "dist/MarketHub-release.apk" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release_notes.md --latest
          else
            gh release create "$TAG" "dist/MarketHub-release.apk" \
              --title "$TITLE" \
              --notes-file release_notes.md \
              --latest
          fi

      - name: Clean Up Temporary Keystore Files
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/markethub-release-signing.jks"
          if [ -n "${KEYSTORE_PATH:-}" ]; then
            rm -f "${KEYSTORE_PATH}"
          fi
          rm -f my-upload-key.jks release_notes.md
          echo "Temporary keystore files cleaned up."
